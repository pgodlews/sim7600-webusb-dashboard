name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Rebuild index.html from src/
        run: node assemble.cjs

      - name: Check the committed index.html is up to date
        run: git diff --exit-code -- index.html

      - name: Check JavaScript syntax
        run: node --check src/app.js

      - name: Run simulated USB and protocol tests
        run: node tests/transport.cjs src/app.js
